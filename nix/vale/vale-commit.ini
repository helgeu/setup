# Global Vale configuration for commit messages. Managed by nix (nix/vale).
# vale-commit uses this file. The Commits package (jdkato/commits) supplies
# the styles and the Commit View, which splits a message into subject, body
# and trailers.
StylesPath = styles
MinAlertLevel = suggestion

[COMMIT_EDITMSG]
BasedOnStyles = Commits, Conventional
View = Commit

# House rule: a header has at most 72 characters.
Commitlint.HeaderLength = YES
Commitlint.HeaderLength[max] = 72
