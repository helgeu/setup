# Global Vale configuration for English text. Managed by nix (nix/vale).
# vale-check uses this file when a repository has no .vale.ini of its own.
# Based on the SuperOffice docs setup (SuperOfficeDocs/docs, MIT).
StylesPath = styles
MinAlertLevel = suggestion

[*.{md,txt}]
BasedOnStyles = Vale, Microsoft, Formatting

# House style keeps full forms ("do not"), as STE and the wiki ADRs do.
Microsoft.Contractions = NO

# House style keeps trailing punctuation outside closing quotes (logical style).
Microsoft.Quotes = NO