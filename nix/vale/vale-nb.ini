# Global Vale configuration for Norwegian Bokmal text. Managed by nix (nix/vale).
# Only Norwegian spelling (Hunspell nb_NO), formatting and our own NB rules
# (abbreviation hyphen, LIX per sentence, sentence length) apply.
# The English Microsoft rules do not apply to Norwegian text.
StylesPath = styles
MinAlertLevel = suggestion

[*.{md,txt}]
BasedOnStyles = Formatting, NB