extends: script
message: "Put the work item in a footer: 'Fixes #123' closes it, 'Refs: #123' only links it."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  // Split the message the way the Commit View does: a subject line, then
  // paragraphs. A paragraph whose first line is "Token: value" or
  // "Token #ref" is a footer. Comment lines are skipped, and the
  // "commit -v" scissors line ends the message.
  lines := text.split(scope, "\n")
  offs := []
  pos := 0
  for i := 0; i < len(lines); i++ {
    offs = append(offs, pos)
    pos += len(lines[i]) + 1
  }
  n := len(lines)
  for i := 0; i < len(lines); i++ {
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, lines[i]) {
      n = i
      break
    }
  }
  h := -1
  for i := 0; i < n; i++ {
    if text.trim_space(lines[i]) != "" && !text.has_prefix(lines[i], "#") {
      h = i
      break
    }
  }
  body := []
  trailers := []
  if h >= 0 {
    cur := undefined
    for i := h + 1; i <= n; i++ {
      l := ""
      if i < n {
        l = lines[i]
      }
      if i < n && text.has_prefix(l, "#") {
        continue
      }
      if i == n || text.trim_space(l) == "" {
        if cur != undefined {
          if text.re_match(`^(?:(?i:breaking[ -]change)|[\w-]+)(?:: | #)`, lines[cur[0]]) {
            trailers = append(trailers, cur)
          } else {
            body = append(body, cur)
          }
          cur = undefined
        }
        continue
      }
      if cur == undefined {
        cur = [i]
      } else {
        cur = append(cur, i)
      }
    }
  }
  hit := func(i) {
    matches = append(matches, {begin: offs[i], end: offs[i] + len(lines[i])})
  }
  // A body line that is only a work item reference ("Related to #1",
  // "ado id: #1", "US (#1, #2)") is not a valid footer.
  for p := 0; p < len(body); p++ {
    for k := 0; k < len(body[p]); k++ {
      i := body[p][k]
      if text.re_match(`^\s*(?:[A-Za-z][\w-]*\s*){0,3}[:(]?\s*#\d+(?:\s*[,&]\s*#?\d+)*\s*\)?\.?\s*$`, lines[i]) {
        hit(i)
      }
    }
  }
  // A footer with a work item reference must use Fixes, Refs or Related-to.
  for t := 0; t < len(trailers); t++ {
    for k := 0; k < len(trailers[t]); k++ {
      i := trailers[t][k]
      if text.re_match(`#\d+`, lines[i]) && !text.re_match(`^(?:Fixes #|Refs: |Related-to: )`, lines[i]) && text.re_match(`^[\w-]+(?:: | #)`, lines[i]) {
        hit(i)
      }
    }
  }
