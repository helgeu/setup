extends: script
message: "The body is long. Say why in at most 2 paragraphs and 60 words. The diff shows how."
level: warning
scope: raw
script: |
  text := import("text")
  matches := []
  // Split the message the way the Commit View does: a subject line, then
  // paragraphs. A paragraph whose first line is "Token: value" or
  // "Token #ref" is a footer. Comment lines are skipped, and the
  // "commit -v" scissors line ends the message.
  lines := text.split(scope, "\n")
  offs := []
  pos := 0
  for i := 0; i < len(lines); i++ {
    offs = append(offs, pos)
    pos += len(lines[i]) + 1
  }
  n := len(lines)
  for i := 0; i < len(lines); i++ {
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, lines[i]) {
      n = i
      break
    }
  }
  h := -1
  for i := 0; i < n; i++ {
    if text.trim_space(lines[i]) != "" && !text.has_prefix(lines[i], "#") {
      h = i
      break
    }
  }
  body := []
  trailers := []
  if h >= 0 {
    cur := undefined
    for i := h + 1; i <= n; i++ {
      l := ""
      if i < n {
        l = lines[i]
      }
      if i < n && text.has_prefix(l, "#") {
        continue
      }
      if i == n || text.trim_space(l) == "" {
        if cur != undefined {
          if text.re_match(`^(?:(?i:breaking[ -]change)|[\w-]+)(?:: | #)`, lines[cur[0]]) {
            trailers = append(trailers, cur)
          } else {
            body = append(body, cur)
          }
          cur = undefined
        }
        continue
      }
      if cur == undefined {
        cur = [i]
      } else {
        cur = append(cur, i)
      }
    }
  }
  hit := func(i) {
    matches = append(matches, {begin: offs[i], end: offs[i] + len(lines[i])})
  }
  words := 0
  for p := 0; p < len(body); p++ {
    for k := 0; k < len(body[p]); k++ {
      words += len(text.fields(lines[body[p][k]]))
    }
  }
  if len(body) > 2 || words > 60 {
    hit(body[0][0])
  }
